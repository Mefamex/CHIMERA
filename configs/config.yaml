# ==========================================
# CHIMERA AGENT - SYSTEM CONFIGURATION
# ==========================================

app:
  name: "Chimera Agent"
  version: "1.0.0"
  date: "2025-01-31"
  environment: "development"
  debug: true

server:
  host: "localhost"
  port: 8787
  read_timeout: 15s
  write_timeout: 15s

runtimes:
  python: "./runtimes/python-3.14.2/.venv/bin/python"
  node_modules: "./runtimes/node-v25.4.0/node_modules"
  node_bin: "/usr/bin/node"

llm:
  provider: "ollama"
  host: "http://localhost:11434"
  model_main: "qwen2.5-coder:7b"
  model_coder: "qwen2.5-coder:7b"
  temperature: 0.7
  context_window: 8192
  format: "json"
  max_conversation_messages: 25

# services:
#   python_analyzer:
#     url: "http://localhost:8000"
#     timeout: 30s
#
#   node_browser:
#     url: "http://localhost:3001"
#     timeout: 45s

telegram:
  enabled: true
  token: "ENV_TELEGRAM_TOKEN"
  allowed_users: [123456789]

paths:
  prompts_dir: "./configs/prompts"
  database: "./data/db/chimera.db"
  logsdir: "./data/logs"
