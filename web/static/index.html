<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIMERA | AI Agent Assistant</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        
        <section class="panel chat-panel">
            <header>
                <div class="brand">
                    <i class="fa-solid fa-dragon"></i> CHIMERA <span class="version">v0.1.0</span>
                </div>
                <div class="status">
                    <span id="connection-status" class="offline">OFFLINE</span>
                    <div class="indicator"></div>
                </div>
            </header>

            <div id="chat-history" class="content-area">
                <div class="message bot">
                    <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="text">Sistem başlatıldı. Emirlerinizi bekliyorum, Mefamex.</div>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="Bir görev girin... (Örn: Qwen 14b ile kod analizi yap)" autocomplete="off">
                <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </section>

        <section class="panel logs-panel">
            <header>
                <div class="brand">
                    <i class="fa-solid fa-microchip"></i> SYSTEM LOGS & THOUGHTS
                </div>
                <button id="clear-logs" class="icon-btn" title="Temizle"><i class="fa-solid fa-trash"></i></button>
            </header>

            <div id="logs-container" class="content-area terminal-font">
                <div class="log-entry system">
                    <span class="time">[INIT]</span> CHIMERA Core Systems Loaded...
                </div>
                <div class="log-entry system">
                    <span class="time">[RUNTIME]</span> Python 3.14.2 Connected.
                </div>
                <div class="log-entry system">
                    <span class="time">[RUNTIME]</span> Node v25.4.0 Connected.
                </div>
            </div>
        </section>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
